{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            {% if created %}
                <div class="alert alert-success" role="alert">
                    Подію створено!
                </div>
                <a href="{% url 'home' %}" class="btn btn-primary">Назад на головну</a>
            {% else %}
                <h2>Створити подію</h2>
                <img class="event-page-illustration" src="{% static 'creating_event.png' %}" alt="Ілюстрація створення події">
                {% if error %}
                    <div class="alert alert-danger mt-4" role="alert">{{ error }}</div>
                {% endif %}
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="title">Назва події</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Опис</label>
                        <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="start_time">Дата початку</label>
                        <input type="date" class="form-control" id="start_time" name="start_time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_time">Дата закінчення</label>
                        <input type="date" class="form-control" id="end_time" name="end_time" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Місцезнаходження</label>
                        <input type="text" class="form-control" id="location" name="location">
                    </div>
                    <button type="submit" class="btn btn-primary">Створити</button>
                    <a href="{% url 'events' %}" class="btn btn-secondary">Назад</a>
                </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
