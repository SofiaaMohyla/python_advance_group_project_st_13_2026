{% extends 'base.html' %}
{% block title %}Оцінка{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Додати або редагувати оцінку</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label for="id_student" class="form-label">Учень</label>
                {{ form.student }}
            </div>
            <div class="mb-3">
                <label for="id_subject" class="form-label">Предмет</label>
                {{ form.subject }}
            </div>
            <div class="mb-3">
                <label for="id_grade" class="form-label">Оцінка</label>
                {{ form.grade }}
            </div>
            <div class="mb-3">
                <label for="id_comment" class="form-label">Коментар</label>
                {{ form.comment }}
            </div>
            <button type="submit" class="btn btn-primary">Зберегти</button>
            <a href="{% url 'notebook_list' %}" class="btn btn-secondary">Назад</a>
        </form>
    </div>
</div>
{% endblock %}
