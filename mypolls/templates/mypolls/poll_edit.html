{% extends "base.html" %}

{% block title %}
Редагувати голосування
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        ✏️ Редагувати
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">

            <button
                type="submit"
                class="btn btn-primary">

                💾 Зберегти

            </button>

            <a
                href="{% url 'poll_list' %}"
                class="btn btn-secondary">

                Скасувати

            </a>

        </div>

    </form>

</div>

{% endblock %}
